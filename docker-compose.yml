# International Plebeian Academy - Docker Compose Configuration
# Multi-container orchestration for local development

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: plebeian-academy-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tribunal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-plebeian_academy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tribunal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy-network

  # Redis Cache and Message Queue
  redis:
    image: redis:7-alpine
    container_name: plebeian-academy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy-network

  # Backend Flask Application
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: plebeian-academy-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tribunal}:${POSTGRES_PASSWORD:-change-this-password}@database:5432/${POSTGRES_DB:-plebeian_academy}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/application
      - ./logs:/application/logs
      - ./uploads:/application/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - academy-network

  # Celery Worker for Bot System
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: plebeian-academy-celery-worker
    restart: unless-stopped
    command: celery -A application.celery worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tribunal}:${POSTGRES_PASSWORD:-change-this-password}@database:5432/${POSTGRES_DB:-plebeian_academy}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/application
      - ./logs:/application/logs
    depends_on:
      - redis
      - database
      - backend
    networks:
      - academy-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: plebeian-academy-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - VITE_WEBSOCKET_URL=http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/application
      - /application/node_modules
    depends_on:
      - backend
    networks:
      - academy-network

  # Nginx Reverse Proxy (Production-like setup)
  nginx:
    image: nginx:alpine
    container_name: plebeian-academy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - academy-network

volumes:
  database-data:
    driver: local
  redis-data:
    driver: local

networks:
  academy-network:
    driver: bridge
