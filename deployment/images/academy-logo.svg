<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- International Plebeian Tribunal Academy Logo -->
  <!-- Globe with Scales of Justice -->
  
  <!-- Globe -->
  <circle cx="100" cy="100" r="90" fill="#007BFF" opacity="0.1"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#007BFF" stroke-width="3"/>
  
  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="85" ry="30" fill="none" stroke="#007BFF" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="85" ry="60" fill="none" stroke="#007BFF" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Longitude lines -->
  <ellipse cx="100" cy="100" rx="30" ry="85" fill="none" stroke="#007BFF" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="60" ry="85" fill="none" stroke="#007BFF" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Center meridian -->
  <line x1="100" y1="15" x2="100" y2="185" stroke="#007BFF" stroke-width="2"/>
  
  <!-- Equator -->
  <line x1="15" y1="100" x2="185" y2="100" stroke="#007BFF" stroke-width="2"/>
  
  <!-- Scales of Justice -->
  <g transform="translate(100, 100)">
    <!-- Central pillar -->
    <rect x="-3" y="-40" width="6" height="80" fill="#007BFF" rx="3"/>
    
    <!-- Balance beam -->
    <rect x="-50" y="-43" width="100" height="6" fill="#007BFF" rx="3"/>
    
    <!-- Left scale -->
    <g transform="translate(-35, -40)">
      <!-- Chain -->
      <line x1="0" y1="0" x2="0" y2="20" stroke="#007BFF" stroke-width="2"/>
      <!-- Pan -->
      <ellipse cx="0" cy="25" rx="15" ry="5" fill="none" stroke="#007BFF" stroke-width="2"/>
      <path d="M -15,25 L -15,30 L 15,30 L 15,25" fill="none" stroke="#007BFF" stroke-width="2"/>
    </g>
    
    <!-- Right scale -->
    <g transform="translate(35, -40)">
      <!-- Chain -->
      <line x1="0" y1="0" x2="0" y2="20" stroke="#007BFF" stroke-width="2"/>
      <!-- Pan -->
      <ellipse cx="0" cy="25" rx="15" ry="5" fill="none" stroke="#007BFF" stroke-width="2"/>
      <path d="M -15,25 L -15,30 L 15,30 L 15,25" fill="none" stroke="#007BFF" stroke-width="2"/>
    </g>
    
    <!-- Base -->
    <rect x="-20" y="40" width="40" height="8" fill="#007BFF" rx="2"/>
  </g>
  
  <!-- Academy Text (optional, can be removed for simpler logo) -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007BFF" text-anchor="middle">IPTA</text>
</svg>
