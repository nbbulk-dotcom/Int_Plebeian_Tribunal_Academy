
apiVersion: v1
kind: Service
metadata:
  name: plebeian-academy-frontend
  labels:
    app: plebeian-academy
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: plebeian-academy
    component: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: plebeian-academy-backend
  labels:
    app: plebeian-academy
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: plebeian-academy
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plebeian-academy-config
data:
  blockchain-url: "http://blockchain-node:8545"
  app-version: "1.0.0"
  environment: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: plebeian-academy-secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/plebeian_academy"
  jwt-secret: "change-this-in-production"
  blockchain-private-key: "change-this-in-production"
