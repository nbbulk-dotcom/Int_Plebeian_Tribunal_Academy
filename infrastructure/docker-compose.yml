version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - plebeian-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/plebeian_academy
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-secret-key}
      - BLOCKCHAIN_NETWORK_URL=http://blockchain:8545
      - REDIS_URL=redis://redis:6379
      - APP_VERSION=1.0.0
    depends_on:
      - postgres
      - redis
      - blockchain
    networks:
      - plebeian-network
    restart: unless-stopped
    volumes:
      - backend-data:/app/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plebeian_academy
    ports:
      - "5432:5432"
    networks:
      - plebeian-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - plebeian-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

  blockchain:
    image: trufflesuite/ganache:latest
    ports:
      - "8545:8545"
    command: 
      - "--host"
      - "0.0.0.0"
      - "--accounts"
      - "10"
      - "--defaultBalanceEther"
      - "1000"
      - "--networkId"
      - "1337"
    networks:
      - plebeian-network
    restart: unless-stopped

  bot-coordinator:
    build:
      context: ../bots
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - redis
    networks:
      - plebeian-network
    restart: unless-stopped

networks:
  plebeian-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  backend-data:
